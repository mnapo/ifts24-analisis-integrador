name: Validar presentación

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "package.json"
      - "tsconfig.json"
      - ".github/workflows/validar-presentacion.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm install
      - run: npx tsc --noEmit
      - run: npm run build
